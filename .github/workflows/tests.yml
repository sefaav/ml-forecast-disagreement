# Synthetic test suite only: no WRDS, CRSP or OSAP access, no secrets, nothing under data/.
name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pandas: ["2.2.3", "3.0.2"]
    name: pytest (pandas ${{ matrix.pandas }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install the package, test dependencies, pandas ${{ matrix.pandas }} and the locked scikit-learn
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" "pandas==${{ matrix.pandas }}" "scikit-learn==1.9.1"
      - name: Run the synthetic tests
        run: python -m pytest
