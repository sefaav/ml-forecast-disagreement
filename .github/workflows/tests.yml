# Synthetic test suite only: no WRDS, CRSP or OSAP access, no secrets, nothing under data/.
name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pandas: ["2.2.3", "3.0.2"]
    name: pytest (pandas ${{ matrix.pandas }})
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install CPU-only PyTorch, the package, test dependencies, pandas ${{ matrix.pandas }} and the locked model libraries
        run: |
          python -m pip install --upgrade pip
          # CPU build from the PyTorch index only; it already satisfies torch>=2.14 for the next command.
          python -m pip install "torch==2.14.1+cpu" --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[dev]" "pandas==${{ matrix.pandas }}" "scikit-learn==1.9.1" "lightgbm==4.7.0"
          python -c "import torch; assert torch.__version__ == '2.14.1+cpu', torch.__version__"
      - name: Run the synthetic tests
        run: python -m pytest
